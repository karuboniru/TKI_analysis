[project]
name = "tki-analysis-workflow"
version = "0.1.0"
description = "Reproducible GiBUU generation and MINERvA TKI analysis workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6,<7",
  "snakemake>=9,<10",
  "snakemake-executor-plugin-slurm>=1,<2",
  "uproot>=5,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]
